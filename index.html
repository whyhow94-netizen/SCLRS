<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SCLRS: Simulasi Web</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; }
    .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .students-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; width: 190px; border: 1px solid #334155; }
    .card.locked { opacity: 0.6; border-color: #ef4444; }
    .screen { background: #020617; color: #38bdf8; font-family: monospace; padding: 8px; font-size: 18px; text-align: right; margin-bottom: 10px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button { padding: 8px 0; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; }
    button:disabled { cursor: not-allowed; opacity: 0.4; }
    .btn-num { background: #334155; color: white; }
    .btn-action { background: #f59e0b; color: white; }
    .btn-sub { background: #22c55e; color: white; }
    .btn-reset { background: #ef4444; color: white; padding: 6px 12px; margin-right: 20px; border-radius: 4px; vertical-align: middle; }
    .teacher-card { background: #1e293b; padding: 20px; border-radius: 10px; width: 420px; border: 2px solid #0284c7; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
    th { background: #0369a1; }
    .status-correct { color: #4ade80; font-weight: bold; }
    .status-wrong { color: #f87171; font-weight: bold; }
    .rank-1 { background: rgba(234, 179, 8, 0.2); font-weight: bold; color: #facc15; }
  </style>
</head>
<body>

  <h2>SIMULASI PENGUJIAN PROJEK DI BILIK DARJAH</h2>

  <div style="margin-bottom: 15px; background: #1e293b; display: inline-block; padding: 12px 20px; border-radius: 8px;">
    <button class="btn-reset" onclick="resetSkorKeseluruhan()">⚠️ Reset Semua Skor</button>
    <label style="vertical-align: middle;"><b>Skema Soalan: </b></label>
    <input type="text" id="inputSkema" value="125" maxlength="9" style="padding: 5px; font-size: 16px; width: 90px; text-align: center; vertical-align: middle;">
    <button onclick="setSkema()" style="padding: 6px 12px; background: #0284c7; color: white; border-radius: 4px; margin-left: 5px; vertical-align: middle;">Set Skema (Buka Kunci)</button>
  </div>

  <div class="container">
    <div id="studentsArea" class="students-container"></div>
    <div class="teacher-card">
      <h3>📊 Papan Kedudukan Masa-Nyata</h3>
      <p>Skema Semasa: <b id="skemaText" style="color: #38bdf8;">125</b></p>
      <table>
        <thead>
          <tr><th>Ked.</th><th>Nama</th><th>Jawapan</th><th>Status</th><th>Markah</th></tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let skemaJawapan = "125";
    let masaHantarKaunter = 0;

    let senaraiMurid = [
      { id: 1, nama: "Ahmad", inputSemasa: "", jawapanHantar: "-", status: "Menunggu...", markah: 0, masaHantar: 0, terkunci: false },
      { id: 2, nama: "Siti",  inputSemasa: "", jawapanHantar: "-", status: "Menunggu...", markah: 0, masaHantar: 0, terkunci: false },
      { id: 3, nama: "Chong", inputSemasa: "", jawapanHantar: "-", status: "Menunggu...", markah: 0, masaHantar: 0, terkunci: false }
    ];

    function setSkema() {
      let val = document.getElementById("inputSkema").value.trim().toUpperCase();
      if (val !== "") {
        skemaJawapan = val;
        document.getElementById("skemaText").innerText = skemaJawapan;
        senaraiMurid.forEach(m => { m.terkunci = false; m.inputSemasa = ""; m.status = "Menunggu..."; });
        binaUI(); kemaskiniLeaderboard();
      }
    }

    function resetSkorKeseluruhan() {
      if (confirm("AMARAN: Adakah anda pasti mahu memadam markah keseluruhan murid?")) {
        masaHantarKaunter = 0;
        senaraiMurid.forEach(m => { m.markah = 0; m.status = "Menunggu..."; m.inputSemasa = ""; m.jawapanHantar = "-"; m.masaHantar = 0; m.terkunci = false; });
        binaUI(); kemaskiniLeaderboard();
      }
    }

    function tekanNombor(idx, val) {
      if (senaraiMurid[idx].terkunci) return;
      if (senaraiMurid[idx].inputSemasa.length < 9) {
        senaraiMurid[idx].inputSemasa += val;
        document.getElementById(`screen-${idx}`).innerText = senaraiMurid[idx].inputSemasa;
      }
    }

    function padamInput(idx) {
      if (senaraiMurid[idx].terkunci) return;
      senaraiMurid[idx].inputSemasa = "";
      document.getElementById(`screen-${idx}`).innerText = "_";
    }

    function hantarJawapan(idx) {
      let m = senaraiMurid[idx];
      if (m.terkunci || m.inputSemasa === "") return;

      m.jawapanHantar = m.inputSemasa; m.terkunci = true;
      masaHantarKaunter++; m.masaHantar = masaHantarKaunter;

      if (m.inputSemasa.toUpperCase() === skemaJawapan.toUpperCase()) { m.markah += 1; m.status = "BETUL (+1)"; } 
      else { m.status = "SALAH (0)"; }
      
      m.inputSemasa = ""; binaUI(); kemaskiniLeaderboard();
    }

    function binaUI() {
      const area = document.getElementById("studentsArea"); area.innerHTML = "";
      senaraiMurid.forEach((m, idx) => {
        let lClass = m.terkunci ? "card locked" : "card";
        let dis = m.terkunci ? "disabled" : "";
        let sTxt = m.terkunci ? "TERKUNCI" : (m.inputSemasa || "_");
        area.innerHTML += `
          <div class="${lClass}"><h4>Meja ${m.id}: ${m.nama}</h4><div id="screen-${idx}" class="screen">${sTxt}</div>
            <div class="grid">
              <button class="btn-num" ${dis} onclick="tekanNombor(${idx},'1')">1</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'2')">2</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'3')">3</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'A')">A</button>
              <button class="btn-num" ${dis} onclick="tekanNombor(${idx},'4')">4</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'5')">5</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'6')">6</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'B')">B</button>
              <button class="btn-num" ${dis} onclick="tekanNombor(${idx},'7')">7</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'8')">8</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'9')">9</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'C')">C</button>
              <button class="btn-action" ${dis} onclick="padamInput(${idx})">*</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'0')">0</button><button class="btn-sub" ${dis} onclick="hantarJawapan(${idx})">#</button><button class="btn-num" ${dis} onclick="tekanNombor(${idx},'D')">D</button>
            </div></div>`;
      });
    }

    function kemaskiniLeaderboard() {
      const tbody = document.getElementById("leaderboardBody"); tbody.innerHTML = "";
      let sorted = [...senaraiMurid].sort((a, b) => b.markah !== a.markah ? b.markah - a.markah : a.masaHantar - b.masaHantar);
      sorted.forEach((m, r) => {
        let st = m.status.includes("BETUL") ? "status-correct" : m.status.includes("SALAH") ? "status-wrong" : "";
        let rk = (r === 0 && m.markah > 0) ? "rank-1" : "";
        tbody.innerHTML += `<tr class="${rk}"><td><b>#${r + 1}</b></td><td>${m.nama}</td><td><code>${m.jawapanHantar}</code></td><td class="${st}">${m.status}</td><td><b>${m.markah}</b></td></tr>`;
      });
    }

    binaUI(); kemaskiniLeaderboard();
  </script>
</body>
</html>
